name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install the exact locked dependencies
        run: uv sync --locked

      - name: Run the test suite
        run: uv run pytest -q

      - name: Check dependencies for known vulnerabilities
        run: uvx pip-audit==2.9.0 -r requirements.txt --no-deps --disable-pip
