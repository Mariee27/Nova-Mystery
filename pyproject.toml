[project]
name = "nova-mystery"
version = "1.0.0"
description = "A five-minute multiplayer murder mystery (Introduction to Programming, Nova SBE)"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.67.0",
    "qrcode[pil]==8.2",
    "openai==3.52.0",
    "psycopg[binary]==3.2.9",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
