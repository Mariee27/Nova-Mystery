[project]
name = "murder-at-nova"
version = "1.0.0"
description = "A five-minute multiplayer murder mystery (Introduction to Programming, Nova SBE)"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.37",
    "qrcode[pil]>=7.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
