<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
<!-- An interior staircase: white steps climbing to an upper gallery, a glass balustrade with a
     slim handrail, a long window with the evening outside, light falling across the treads. -->
<defs>
  <linearGradient id="st-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eceef1"/><stop offset="1" stop-color="#d4d8de"/></linearGradient>
  <linearGradient id="st-window" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3f72"/><stop offset=".7" stop-color="#b07060"/><stop offset="1" stop-color="#e6a06c"/></linearGradient>
  <linearGradient id="st-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfe0f0" stop-opacity=".45"/><stop offset="1" stop-color="#8fc0dc" stop-opacity=".25"/></linearGradient>
</defs>
<rect width="400" height="500" fill="url(#st-wall)"/>
<!-- the tall window -->
<rect x="250" y="30" width="120" height="250" fill="url(#st-window)"/>
<circle cx="330" cy="230" r="16" fill="#ffd9a6" opacity=".9"/>
<rect x="250" y="246" width="120" height="34" fill="#4a5f8e" opacity=".8"/>
<g stroke="#f4f5f7" stroke-width="6"><path d="M310 30 v250 M250 110 h120 M250 190 h120"/></g>
<rect x="250" y="30" width="120" height="250" fill="none" stroke="#f4f5f7" stroke-width="8"/>
<!-- warm light across the wall -->
<polygon points="250,280 370,280 300,500 120,500" fill="#ffd9a6" opacity=".18"/>
<!-- upper gallery -->
<rect x="0" y="120" width="200" height="22" fill="#f8f8f8"/><rect x="0" y="142" width="200" height="6" fill="#b9c0c8"/>
<rect x="0" y="62" width="200" height="58" fill="url(#st-glass)" stroke="#d8e9f2" stroke-width="1.5"/>
<rect x="0" y="58" width="200" height="5" fill="#9aa6b4"/>
<!-- the stairs, climbing from the bottom right up to the gallery -->
<g>
  <polygon points="200,142 230,142 230,160 200,160" fill="#ffffff"/>
  <polygon points="216,160 250,160 250,180 216,180" fill="#f6f6f6"/>
  <polygon points="232,180 270,180 270,202 232,202" fill="#ffffff"/>
  <polygon points="248,202 290,202 290,226 248,226" fill="#f3f3f3"/>
  <polygon points="264,226 310,226 310,252 264,252" fill="#ffffff"/>
  <polygon points="280,252 330,252 330,280 280,280" fill="#f3f3f3"/>
  <polygon points="296,280 350,280 350,310 296,310" fill="#ffffff"/>
  <polygon points="312,310 370,310 370,342 312,342" fill="#f3f3f3"/>
  <polygon points="328,342 390,342 390,376 328,376" fill="#ffffff"/>
  <polygon points="344,376 400,376 400,412 344,412" fill="#f3f3f3"/>
</g>
<g fill="#c4cad1"><rect x="200" y="158" width="30" height="2"/><rect x="216" y="178" width="34" height="2"/><rect x="232" y="200" width="38" height="2"/><rect x="248" y="224" width="42" height="2"/><rect x="264" y="250" width="46" height="2"/><rect x="280" y="278" width="50" height="2"/><rect x="296" y="308" width="54" height="2"/><rect x="312" y="340" width="58" height="2"/><rect x="328" y="374" width="62" height="2"/></g>
<!-- underside of the flight -->
<polygon points="200,160 400,412 400,440 190,170" fill="#b9c0c8"/>
<!-- the glass balustrade along the flight with its handrail -->
<polygon points="196,82 400,336 400,392 196,140" fill="url(#st-glass)" stroke="#d8e9f2" stroke-width="1.5"/>
<path d="M196 80 L400 334" stroke="#8a93a0" stroke-width="5" stroke-linecap="round"/>
<g stroke="#d8e9f2" stroke-width="1"><path d="M246 144 v58 M298 208 v58 M350 272 v58"/></g>
<!-- ground floor -->
<rect x="0" y="440" width="400" height="60" fill="#cfc7b8"/>
<g stroke="#b5ad9c" stroke-width="1"><path d="M0 460 H400 M0 482 H400 M80 440 v60 M200 440 v60"/></g>
<!-- a figure on the gallery and a plant -->
<g fill="#243247"><circle cx="70" cy="76" r="9"/><path d="M58 120 q0 -36 12 -36 q12 0 12 36 z"/></g>
<g><rect x="40" y="410" width="34" height="30" fill="#e8e3d8"/><ellipse cx="57" cy="398" rx="26" ry="20" fill="#3e5f3a"/><ellipse cx="46" cy="384" rx="14" ry="12" fill="#4f7a49"/></g>
<rect x="40" y="200" width="130" height="24" rx="3" fill="#1a2a44"/>
<text x="105" y="216.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="2.4" fill="#f2d79a" text-anchor="middle">FLOOR 1  ↑</text>
</svg>
