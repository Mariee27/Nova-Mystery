<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
<!-- Writing pressed into a notepad page, raised by rubbing with a pencil: pale strokes in graphite.
     Slots filled by the game: victim, place, time. -->
<defs>
  <radialGradient id="nt-graphite" cx="50%" cy="45%" r="75%">
    <stop offset="0" stop-color="#4a4d55"/><stop offset=".7" stop-color="#2c2f36"/><stop offset="1" stop-color="#17191e"/>
  </radialGradient>
  <pattern id="nt-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#5b5f68" stroke-width="1.4" opacity=".35"/>
  </pattern>
</defs>
<rect width="400" height="500" fill="url(#nt-graphite)"/>
<rect width="400" height="500" fill="url(#nt-hatch)"/>
<g stroke="#8d929c" stroke-width="1" opacity=".35">
  <line x1="0" y1="96" x2="400" y2="96"/><line x1="0" y1="170" x2="400" y2="170"/>
  <line x1="0" y1="244" x2="400" y2="244"/><line x1="0" y1="318" x2="400" y2="318"/><line x1="0" y1="392" x2="400" y2="392"/>
</g>
<line x1="48" y1="0" x2="48" y2="500" stroke="#b46a6a" stroke-width="1" opacity=".35"/>
<g font-family="'Segoe Print', 'Bradley Hand', 'Comic Neue', cursive" fill="#f1f3f6" opacity=".92">
  <text data-slot="victim" x="66" y="150" font-size="44">Vale –</text>
  <text data-slot="place" x="92" y="226" font-size="36">Horizon Hall</text>
  <text data-slot="time" x="66" y="300" font-size="46">23:30 ?</text>
  <text x="66" y="372" font-size="30" opacity=".75">don't tell anyone</text>
</g>
<path d="M300 300 l40 -10 M310 318 l26 -6" stroke="#f1f3f6" stroke-width="3" stroke-linecap="round" opacity=".7"/>
<path d="M66 392 q60 12 140 0" stroke="#f1f3f6" stroke-width="2.4" fill="none" opacity=".6"/>
</svg>
