<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
<!-- A corner of the main building at golden hour: white vertical sun fins on the façade, glass
     behind them, the lowercase "nova" lettering on the wall, a slice of sky and sea. -->
<defs>
  <linearGradient id="fc-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b6aa8"/><stop offset=".7" stop-color="#e7a46f"/><stop offset="1" stop-color="#f3c48f"/></linearGradient>
  <linearGradient id="fc-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b4f7e"/><stop offset="1" stop-color="#7fa6cc"/></linearGradient>
  <linearGradient id="fc-wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6f4ef"/><stop offset="1" stop-color="#d6d9de"/></linearGradient>
  <linearGradient id="fc-fin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd4da"/></linearGradient>
</defs>
<rect width="400" height="500" fill="url(#fc-sky)"/>
<circle cx="350" cy="380" r="30" fill="#ffe0b0" opacity=".85"/>
<rect x="250" y="400" width="150" height="40" fill="#5c76a8"/>
<g stroke="#ffe0b0" stroke-width="2" opacity=".6"><path d="M300 410 h90 M314 422 h66"/></g>
<!-- the building, rising from the bottom left to the top -->
<polygon points="0,0 250,0 250,440 0,500" fill="url(#fc-glass)"/>
<g fill="#ffcf7a" opacity=".7"><rect x="20" y="300" width="60" height="40"/><rect x="140" y="180" width="50" height="40"/><rect x="40" y="90" width="50" height="40"/></g>
<!-- white floor slabs -->
<g fill="#f6f4ef"><polygon points="0,60 250,52 250,64 0,74"/><polygon points="0,170 250,156 250,168 0,184"/><polygon points="0,280 250,260 250,272 0,294"/><polygon points="0,390 250,364 250,376 0,404"/></g>
<!-- the vertical sun fins -->
<g fill="url(#fc-fin)">
  <polygon points="14,0 30,0 30,500 14,500"/><polygon points="58,0 74,0 74,492 58,494"/><polygon points="102,0 118,0 118,482 102,484"/>
  <polygon points="146,0 162,0 162,472 146,474"/><polygon points="190,0 206,0 206,462 190,464"/><polygon points="230,0 246,0 246,452 230,454"/>
</g>
<g fill="#000" opacity=".12"><rect x="30" y="0" width="6" height="500"/><rect x="74" y="0" width="6" height="494"/><rect x="118" y="0" width="6" height="484"/><rect x="162" y="0" width="6" height="474"/><rect x="206" y="0" width="6" height="464"/></g>
<!-- the solid white corner with the lettering -->
<polygon points="250,0 300,0 300,428 250,440" fill="url(#fc-wall)"/>
<rect x="250" y="0" width="4" height="440" fill="#ffffff"/>
<text x="0" y="0" transform="translate(286 300) rotate(-90)" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" letter-spacing="4" fill="#1d2b49">nova</text>
<text x="0" y="0" transform="translate(297 428) rotate(-90)" font-family="Helvetica, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#5a6477">SCHOOL OF BUSINESS &amp; ECONOMICS</text>
<!-- a pine at the edge and gulls -->
<g fill="#1f2f24"><rect x="372" y="250" width="6" height="150"/><ellipse cx="370" cy="244" rx="34" ry="16"/><ellipse cx="380" cy="226" rx="24" ry="11"/></g>
<g stroke="#2a3346" stroke-width="2" fill="none"><path d="M320 120 q6 -6 12 0 q6 -6 12 0"/><path d="M350 160 q5 -5 10 0 q5 -5 10 0"/></g>
<rect x="0" y="480" width="400" height="20" fill="#c9b79a"/>
</svg>
