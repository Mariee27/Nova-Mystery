<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
<!-- Looking straight up in the Hovione Atrium: the white galleries frame the big roof of blue
     glass panes and its white grid, with the evening sky beyond. -->
<defs>
  <radialGradient id="sk-sky" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#6fa8dc"/><stop offset=".6" stop-color="#2d63a6"/><stop offset="1" stop-color="#183e72"/></radialGradient>
  <linearGradient id="sk-gal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f3f4"/><stop offset="1" stop-color="#c7ccd3"/></linearGradient>
</defs>
<rect width="400" height="500" fill="#dfe3e8"/>
<!-- the galleries in perspective, stepping in toward the roof -->
<polygon points="0,0 400,0 330,70 70,70" fill="#eef0f2"/><polygon points="0,500 400,500 330,430 70,430" fill="#d3d8de"/>
<polygon points="0,0 70,70 70,430 0,500" fill="#e4e7eb"/><polygon points="400,0 330,70 330,430 400,500" fill="#d9dde2"/>
<g fill="#7fb3d9" opacity=".5"><polygon points="0,0 400,0 380,20 20,20"/><polygon points="0,500 400,500 380,480 20,480"/><polygon points="0,0 20,20 20,480 0,500"/><polygon points="400,0 380,20 380,480 400,500"/></g>
<polygon points="70,70 330,70 300,100 100,100" fill="url(#sk-gal)"/><polygon points="70,430 330,430 300,400 100,400" fill="#bfc5cd"/>
<polygon points="70,70 100,100 100,400 70,430" fill="#d0d5db"/><polygon points="330,70 300,100 300,400 330,430" fill="#c4cad1"/>
<g stroke="#9aa6b4" stroke-width="2" fill="none"><rect x="20" y="20" width="360" height="460"/><rect x="70" y="70" width="260" height="360"/><rect x="100" y="100" width="200" height="300"/></g>
<g fill="#ffd88a" opacity=".8"><rect x="30" y="200" width="30" height="16"/><rect x="340" y="260" width="30" height="16"/><rect x="180" y="34" width="40" height="22"/><rect x="160" y="444" width="44" height="22"/></g>
<!-- the glass roof -->
<rect x="100" y="100" width="200" height="300" fill="url(#sk-sky)"/>
<g fill="#ffffff" opacity=".14"><rect x="100" y="100" width="50" height="60"/><rect x="200" y="160" width="50" height="60"/><rect x="150" y="280" width="50" height="60"/><rect x="250" y="340" width="50" height="60"/></g>
<g fill="#0e2a55" opacity=".25"><rect x="150" y="100" width="50" height="60"/><rect x="250" y="220" width="50" height="60"/><rect x="100" y="280" width="50" height="60"/></g>
<g stroke="#f4f6f9" stroke-width="5"><path d="M150 100 v300 M200 100 v300 M250 100 v300 M100 160 h200 M100 220 h200 M100 280 h200 M100 340 h200"/></g>
<rect x="100" y="100" width="200" height="300" fill="none" stroke="#f4f6f9" stroke-width="7"/>
<circle cx="236" cy="184" r="9" fill="#f6f1df" opacity=".85"/>
<path d="M120 116 l40 40 M226 300 l30 30" stroke="#ffffff" stroke-width="3" opacity=".3"/>
<!-- a name plate on the lowest gallery -->
<rect x="120" y="450" width="160" height="24" rx="3" fill="#1a2a44"/>
<text x="200" y="466.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="2.6" fill="#f2d79a" text-anchor="middle">HOVIONE ATRIUM</text>
</svg>
