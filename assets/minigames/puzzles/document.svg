<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
<!-- A confidential memo with redactions, a coffee ring and a paperclip. Slots: victim, place. -->
<defs>
  <linearGradient id="dc-desk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2027"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
  <linearGradient id="dc-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2efe6"/><stop offset="1" stop-color="#d9d3c3"/></linearGradient>
</defs>
<rect width="300" height="300" fill="url(#dc-desk)"/>
<g transform="rotate(2.5 150 150)">
  <rect x="30" y="18" width="240" height="270" fill="url(#dc-paper)"/>
  <rect x="30" y="18" width="240" height="270" fill="none" stroke="#9c9480" stroke-width=".8"/>
  <text x="48" y="44" font-family="Georgia, serif" font-size="9" letter-spacing="2" fill="#2d2a24">NOVA SBE · OFFICE OF THE DEAN</text>
  <line x1="48" y1="51" x2="252" y2="51" stroke="#2d2a24" stroke-width="1.2"/>
  <g font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#26231e">
    <text x="48" y="72">MEMO · INTERNAL ONLY</text>
    <text data-slot="victim" x="48" y="90">RE: Vale</text>
    <text data-slot="place" x="48" y="106">LOCATION: Horizon Hall</text>
    <text x="48" y="130">The matter we discussed must</text>
    <text x="48" y="146">not reach the board before</text>
    <text x="48" y="194">Keys to be returned at once.</text>
    <text x="48" y="210">Destroy this after reading.</text>
  </g>
  <rect x="200" y="137" width="56" height="12" fill="#0b0b0b"/>
  <rect x="48" y="156" width="150" height="12" fill="#0b0b0b"/>
  <rect x="48" y="172" width="96" height="12" fill="#0b0b0b"/>
  <rect x="150" y="172" width="70" height="12" fill="#0b0b0b"/>
  <g transform="rotate(-14 210 76)">
    <rect x="166" y="60" width="92" height="28" rx="3" fill="none" stroke="#b42318" stroke-width="2.5" opacity=".85"/>
    <text x="212" y="79" font-family="Georgia, serif" font-weight="bold" font-size="12" letter-spacing="1.4" fill="#b42318" text-anchor="middle" opacity=".85">CONFIDENTIAL</text>
  </g>
  <path d="M60 254 q12 -16 22 -4 q10 10 20 -6 q8 -10 18 2" stroke="#1d3a8a" stroke-width="1.6" fill="none"/>
  <line x1="56" y1="262" x2="140" y2="262" stroke="#26231e" stroke-width=".8"/>
  <text x="58" y="275" font-family="Georgia, serif" font-style="italic" font-size="9" fill="#26231e">signed</text>
  <circle cx="214" cy="248" r="26" fill="none" stroke="#7a5230" stroke-width="5" opacity=".35"/>
  <circle cx="214" cy="248" r="20" fill="#7a5230" opacity=".08"/>
</g>
<path d="M40 8 v40 a8 8 0 0 0 16 0 v-34 a5 5 0 0 0 -10 0 v30" fill="none" stroke="#a8b0bd" stroke-width="2.4"/>
<rect width="300" height="300" fill="none" stroke="#000" stroke-width="10" opacity=".4"/>
</svg>
