<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
<!-- The Grand Auditorium after hours: tiered rows of seats in a fan, wooden walls, the big screen
     with the NOVA SBE name, a lectern in a pool of light. -->
<defs>
  <linearGradient id="au-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2618"/><stop offset="1" stop-color="#6e4a2c"/></linearGradient>
  <linearGradient id="au-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f3d72"/><stop offset="1" stop-color="#12264a"/></linearGradient>
  <radialGradient id="au-spot" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe3a8" stop-opacity=".55"/><stop offset="1" stop-color="#ffe3a8" stop-opacity="0"/></radialGradient>
</defs>
<rect width="300" height="300" fill="#140d0a"/>
<!-- ceiling and wooden walls -->
<polygon points="0,0 300,0 252,40 48,40" fill="#1e1612"/>
<g fill="#ffe7b4"><circle cx="90" cy="14" r="2.4"/><circle cx="150" cy="10" r="2.4"/><circle cx="210" cy="14" r="2.4"/><circle cx="120" cy="28" r="1.8"/><circle cx="180" cy="28" r="1.8"/></g>
<rect x="48" y="40" width="204" height="96" fill="url(#au-wall)"/>
<g stroke="#2a1b12" stroke-width="2"><path d="M74 40 v96 M100 40 v96 M200 40 v96 M226 40 v96"/></g>
<polygon points="0,0 48,40 48,170 0,210" fill="#2a1c13"/><polygon points="300,0 252,40 252,170 300,210" fill="#24180f"/>
<g stroke="#3e2a1b" stroke-width="3"><path d="M10 40 v150 M26 44 v134 M290 40 v150 M274 44 v134"/></g>
<!-- the screen -->
<rect x="96" y="50" width="108" height="62" fill="url(#au-screen)" stroke="#0b0b0b" stroke-width="2"/>
<text x="150" y="86" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#f3f0e6" text-anchor="middle" letter-spacing="1">NOVA SBE</text>
<polygon points="96,112 204,112 230,160 70,160" fill="#a9c1e6" opacity=".07"/>
<!-- stage and lectern -->
<polygon points="48,136 252,136 266,160 34,160" fill="#4a3220"/>
<ellipse cx="206" cy="150" rx="36" ry="12" fill="url(#au-spot)"/>
<polygon points="198,124 216,124 212,150 202,150" fill="#2a1b12"/><rect x="196" y="120" width="22" height="5" fill="#6e4a2c"/>
<rect x="88" y="142" width="124" height="10" rx="2" fill="#1a2a44"/>
<text x="150" y="150" font-family="Helvetica, Arial, sans-serif" font-size="6.6" font-weight="bold" letter-spacing="1.8" fill="#f2d79a" text-anchor="middle">GRAND AUDITORIUM</text>
<!-- tiered rows of red seats, fanning out toward the viewer -->
<g>
  <path d="M30 176 Q150 158 270 176 L276 186 Q150 168 24 186 Z" fill="#8e1f1f"/>
  <path d="M20 198 Q150 178 280 198 L286 210 Q150 190 14 210 Z" fill="#a32424"/>
  <path d="M10 224 Q150 202 290 224 L296 238 Q150 216 4 238 Z" fill="#8e1f1f"/>
  <path d="M0 254 Q150 230 300 254 L300 270 Q150 246 0 270 Z" fill="#a32424"/>
  <path d="M0 284 Q150 260 300 284 L300 300 L0 300 Z" fill="#8e1f1f"/>
</g>
<g fill="#5a1212"><path d="M24 186 Q150 168 276 186 L276 190 Q150 172 24 190 Z"/><path d="M14 210 Q150 190 286 210 L286 214 Q150 194 14 214 Z"/><path d="M4 238 Q150 216 296 238 L296 242 Q150 220 4 242 Z"/><path d="M0 270 Q150 246 300 270 L300 274 Q150 250 0 274 Z"/></g>
<g stroke="#3a0e0e" stroke-width="1.4"><path d="M60 172 l-4 16 M100 167 l-2 16 M150 165 v16 M200 167 l2 16 M240 172 l4 16 M50 196 l-5 18 M100 189 l-3 18 M150 186 v18 M200 189 l3 18 M250 196 l5 18 M40 222 l-6 20 M95 213 l-3 20 M150 210 v20 M205 213 l3 20 M260 222 l6 20"/></g>
<g fill="#141016"><circle cx="122" cy="226" r="5"/><path d="M116 240 q0 -10 6 -10 q6 0 6 10 z"/></g>
<rect width="300" height="300" fill="none" stroke="#0d1a2e" stroke-width="6"/>
</svg>
