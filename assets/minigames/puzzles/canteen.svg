<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
<!-- The Canteen at night: big windows onto the dark sea, pendant lamps, a steel serving counter
     with trays, the menu board, long white tables with black chairs, a few late guests. -->
<defs>
  <linearGradient id="cn-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16213f"/><stop offset=".6" stop-color="#243a66"/><stop offset="1" stop-color="#1b2b4c"/></linearGradient>
  <linearGradient id="cn-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4ded2"/><stop offset="1" stop-color="#cfc7b8"/></linearGradient>
  <linearGradient id="cn-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a59c8c"/><stop offset="1" stop-color="#6d665b"/></linearGradient>
</defs>
<rect width="300" height="300" fill="#2a2620"/>
<rect x="0" y="0" width="300" height="30" fill="#3a3530"/>
<rect x="0" y="30" width="300" height="170" fill="url(#cn-wall)"/>
<!-- the windows onto the sea -->
<rect x="10" y="40" width="280" height="76" fill="url(#cn-sea)"/>
<circle cx="236" cy="62" r="9" fill="#f4f1e4" opacity=".85"/>
<path d="M150 98 h70" stroke="#f4f1e4" stroke-width="1.4" opacity=".5"/>
<g fill="#f6efd8"><circle cx="40" cy="54" r="1.2"/><circle cx="110" cy="50" r="1"/><circle cx="170" cy="58" r="1.2"/></g>
<rect x="10" y="102" width="280" height="14" fill="#2c3f6a"/>
<g stroke="#f4f5f6" stroke-width="4"><path d="M70 40 v76 M130 40 v76 M190 40 v76 M250 40 v76"/></g>
<rect x="10" y="40" width="280" height="76" fill="none" stroke="#f4f5f6" stroke-width="5"/>
<!-- pendant lamps -->
<g stroke="#1a120c" stroke-width="1.4"><path d="M60 0 v26 M150 0 v22 M240 0 v26"/></g>
<g fill="#ffe2a0"><ellipse cx="60" cy="28" rx="11" ry="4"/><ellipse cx="150" cy="24" rx="11" ry="4"/><ellipse cx="240" cy="28" rx="11" ry="4"/></g>
<!-- the menu board and the name plate -->
<rect x="200" y="126" width="84" height="22" rx="2" fill="#1d2330"/>
<text x="242" y="141" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" letter-spacing="2" fill="#f2d79a" text-anchor="middle">MENU · 12:00</text>
<rect x="20" y="126" width="92" height="18" rx="2" fill="#1a2a44"/>
<text x="66" y="138.5" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" letter-spacing="2.4" fill="#f2d79a" text-anchor="middle">CANTEEN</text>
<!-- the serving counter with trays -->
<rect x="186" y="156" width="114" height="44" fill="#9aa3ad"/>
<rect x="186" y="152" width="114" height="6" fill="#c5ccd4"/>
<g fill="#e9e4d8"><rect x="194" y="160" width="22" height="8" rx="1"/><rect x="222" y="160" width="22" height="8" rx="1"/><rect x="250" y="160" width="22" height="8" rx="1"/></g>
<g fill="#d98a5f"><circle cx="205" cy="164" r="2.6"/><circle cx="261" cy="164" r="2.6"/></g>
<g fill="#5b8f4e"><circle cx="233" cy="164" r="2.6"/></g>
<!-- the floor -->
<rect x="0" y="200" width="300" height="100" fill="url(#cn-floor)"/>
<g stroke="#8a8273" stroke-width="1"><path d="M0 222 H300 M0 250 H300 M0 282 H300"/></g>
<!-- long white tables with black chairs -->
<g fill="#f4f4f2"><rect x="20" y="206" width="150" height="5"/><rect x="10" y="236" width="170" height="6"/><rect x="0" y="268" width="190" height="7"/></g>
<g stroke="#f4f4f2" stroke-width="1.6"><path d="M26 211 v8 M164 211 v8 M16 242 v10 M174 242 v10 M6 275 v14 M184 275 v14"/></g>
<g fill="#16181d">
  <rect x="34" y="213" width="7" height="8"/><rect x="64" y="213" width="7" height="8"/><rect x="94" y="213" width="7" height="8"/><rect x="124" y="213" width="7" height="8"/><rect x="152" y="213" width="7" height="8"/>
  <rect x="26" y="244" width="9" height="11"/><rect x="62" y="244" width="9" height="11"/><rect x="98" y="244" width="9" height="11"/><rect x="134" y="244" width="9" height="11"/>
  <rect x="20" y="277" width="11" height="15"/><rect x="66" y="277" width="11" height="15"/><rect x="112" y="277" width="11" height="15"/><rect x="158" y="277" width="11" height="15"/>
</g>
<!-- late guests and a tray -->
<g fill="#2b3346"><circle cx="80" cy="198" r="4"/><path d="M75 210 q0 -9 5 -9 q5 0 5 9 z"/><circle cx="118" cy="226" r="5"/><path d="M112 240 q0 -11 6 -11 q6 0 6 11 z"/></g>
<rect x="44" y="262" width="24" height="5" rx="1" fill="#c9a26b"/>
<!-- a pillar and a plant on the right -->
<rect x="200" y="200" width="16" height="100" fill="#d8d2c6"/>
<g><rect x="248" y="258" width="18" height="22" fill="#3a3f48"/><ellipse cx="257" cy="246" rx="15" ry="12" fill="#2f5d34"/><ellipse cx="250" cy="234" rx="9" ry="9" fill="#41784a"/></g>
<rect width="300" height="300" fill="none" stroke="#0d1a2e" stroke-width="6"/>
</svg>
