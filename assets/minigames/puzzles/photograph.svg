    <circle cx="116" cy="146" r="11"/><path d="M98 208 q0 -42 18 -42 q18 0 18 42 z"/>
    <circle cx="152" cy="150" r="11"/><path d="M134 208 q0 -38 18 -38 q18 0 18 38 z"/>
