    <path d="M70 132 v-46 a14 14 0 0 1 28 0 v46 z M114 132 v-46 a14 14 0 0 1 28 0 v46 z M158 132 v-46 a14 14 0 0 1 28 0 v46 z M202 132 v-46 a14 14 0 0 1 28 0 v46 z" fill="#8f7a5a"/>
