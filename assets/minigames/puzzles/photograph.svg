  <radialGradient id="ph-vignette" cx="50%" cy="50%" r="70%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
</defs>
<rect width="300" height="300" fill="url(#ph-cork)"/>
<rect width="300" height="300" fill="#000" opacity=".35"/>
